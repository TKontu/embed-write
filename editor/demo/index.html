<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semantic Text Workbench — thin demo</title>
  <link rel="stylesheet" href="/@nm/e/prosemirror-view/style/prosemirror.css">
  <link rel="stylesheet" href="/@nm/e/prosemirror-tables/style/tables.css">
  <link rel="stylesheet" href="/@nm/e/prosemirror-gapcursor/style/gapcursor.css">
  <link rel="stylesheet" href="/@app/src/signals.css">
  <link rel="stylesheet" href="/@app/demo/demo.css">
  <style id="legend-css"></style>
  <!--IMPORTMAP-->
</head>
<body>
  <header class="bar">
    <label class="picker">Sample
      <select id="samples" aria-label="Sample report"></select>
    </label>
    <button id="save-btn" type="button">Save</button>
    <button id="source-btn" type="button" title="Toggle source view (Ctrl+Shift+M / Cmd+Shift+M)" aria-keyshortcuts="Control+Shift+M Meta+Shift+M">Source view</button>
    <button id="overlay-btn" type="button" aria-pressed="false" aria-keyshortcuts="Control+Shift+O Meta+Shift+O">Overlay off</button>
    <label class="picker">Granularity
      <select id="granularity-select" aria-label="Label granularity">
        <option value="section">Section</option>
        <option value="paragraph" selected>Paragraph</option>
        <option value="sentence">Sentence</option>
      </select>
    </label>
    <label class="picker">Overlay
      <select id="overlay-select" aria-label="Overlay"></select>
    </label>
    <span id="status" role="status"></span>
  </header>
  <main class="layout">
    <div id="minimap" class="minimap-mount"></div>
    <section id="editor" class="editor" aria-label="Editor"></section>
    <aside class="legend" aria-label="Provisional move legend">
      <h2>Legend</h2>
      <p class="provisional">Provisional labels: synthetic</p>
      <p class="note">Placeholder move names for the demo, not the expert's inventory.</p>
      <div id="legend-panel"></div>
    </aside>
  </main>
  <div id="link-dialog" class="link-dialog" role="dialog" aria-modal="true" aria-labelledby="link-title" hidden>
    <form id="link-form">
      <p id="link-title">Link <q id="link-text"></q> to</p>
      <input id="link-href" type="text" inputmode="url" aria-label="Link address" placeholder="https://…" autocomplete="off">
      <button id="link-ok" type="submit">OK</button>
      <button id="link-cancel" type="button">Cancel</button>
    </form>
  </div>
  <script type="module" src="/@app/demo/app.js"></script>
</body>
</html>
