name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: No-aggregate-score lint
        run: python3 scripts/lint_no_aggregate.py
      - name: Signal gate check
        run: python3 -m analysis.signal_gates
      - name: Nightly gates
        run: python3 -m experiments.nightly
