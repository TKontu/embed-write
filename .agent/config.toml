# Reconcile-loop project configuration (adapted from config.example.toml).
[project]
architecture = "docs/architecture.md"
backlog = "docs/todo.md"
item_details = "docs"            # docs/todo-NN-*.md hold the item rows and checks
decisions = "docs/decisions.md"  # append-only; create with the first recorded decision
default_branch = "main"

[verification]
# Until the product stack exists, the gate is the workflow tooling's own tests.
# Replace with the real gate (and update CLAUDE.md's Project Commands) once code lands.
command = ["python3", "-m", "unittest", "discover", "-s", "tests"]
environment = "offline; local models only (invariant I9); no network services"

[policy]
# Delegated standing by the operator (D-002): the planner merges without asking.
merge_authority = "planner, standing delegation D-002: merge a PR whose current head passed independent review-round and the configured gate and is mergeable; operator only for PRs that change docs/decisions.md, docs/architecture.md or .agent/config.toml, decide an [H] item, or mark a gate passed; executors never self-merge"
human_tasks = "[H] tasks and the [H] half of [A->H] belong to the expert; agents prepare, never decide"

[supervisor]
# Herdr names are global across repos; keeps the planner at round-planner-embed-write
name = "embed-write"
